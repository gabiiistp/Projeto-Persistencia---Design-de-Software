spring.application.name=api-gateway
server.port=8080

# --- Rotas do gateway ---
spring.cloud.gateway.routes[0].id=transferencia
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/transferencias/**

spring.cloud.gateway.routes[1].id=pagamento
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/pagamentos/**

spring.cloud.gateway.routes[2].id=saldo
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/saldos/**
