spring.application.name=transferencia
server.port=8081

# --- SQLite local (um arquivo .db por servico) ---
spring.datasource.url=jdbc:sqlite:db_transferencia.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Endereco do microsservico Saldo ---
saldo.url=http://localhost:8083

# --- Endereco do microsservico Integracao Banco Central ---
integracaobc.url=http://localhost:8084